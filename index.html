# **SUBTOPIC 3: CONSOLIDATION PROCEDURES & MECHANICS**

When preparing Consolidated Financial Statements (CFS), we treat the parent and its subsidiaries as if they were a **single legal entity**. This requires a systematic, multi-step mechanical protocol.

---

### **1. THE CORE CONSOLIDATION PROTOCOL (Para B86)**

```
┌────────────────────────────────────────────────────────────────────────┐
│                        STEP 1: LINE-BY-LINE ADDITION                   │
│   Combine like items of assets, liabilities, equity, income, and       │
│   expenses of the parent with those of its subsidiaries.               │
└───────────────────────────────────┬────────────────────────────────────┘
                                    │
                                    ▼
┌────────────────────────────────────────────────────────────────────────┐
│                    STEP 2: ELIMINATE INVESTMENT vs EQUITY              │
│   Cancel Parent's "Investment in Subsidiary" against Parent's portion  │
│   of Subsidiary's Equity (Net Assets) on Acquisition Date.             │
│   (Difference = Goodwill / Capital Reserve per Ind AS 103).            │
└───────────────────────────────────┬────────────────────────────────────┘
                                    │
                                    ▼
┌────────────────────────────────────────────────────────────────────────┐
│                  STEP 3: ELIMINATE INTRA-GROUP BALANCES                │
│   Wipe out intra-group receivables, payables, loans, dividends, and    │
│   transactions in full (Debtors, Creditors, B/R, B/P).                 │
└───────────────────────────────────┬────────────────────────────────────┘
                                    │
                                    ▼
┌────────────────────────────────────────────────────────────────────────┐
│                  STEP 4: ELIMINATE UNREALIZED PROFITS                  │
│   Remove 100% of unrealized profits/losses embedded in closing inventory│
│   or Property, Plant & Equipment (PPE) from intra-group transfers.     │
└────────────────────────────────────────────────────────────────────────┘
```

---

### **2. UNIFORM ACCOUNTING POLICIES & REPORTING DATES**

#### **A. Uniform Accounting Policies (Para B87)**
If a subsidiary uses accounting policies different from the group for like transactions (e.g., Parent uses FIFO for inventory, Subsidiary uses Weighted Average; or Parent uses Cost Model for PPE, Subsidiary uses Revaluation Model), **appropriate adjustments MUST be made** to the subsidiary’s financial statements during consolidation to align them with the group’s policies.

#### **B. Different Reporting Dates (Para B92 – B93)**
* **General Rule:** Parent and subsidiary must prepare financial statements as of the **same reporting date**.
* **Practical Exception:** If impractical, the subsidiary can use financial statements prepared as of a different date, provided:
  1. The difference between reporting dates is **NOT MORE THAN 3 MONTHS**.
  2. Adjustments are made for **significant transactions/events** occurring between the two dates.
  3. The length of reporting periods and any difference in dates must remain consistent from period to period.

---

### **3. INTRA-GROUP BALANCES & TRANSACTIONS (Para B86(c))**

All intra-group balances (Trade Debtors/Creditors, Loans, Bills Receivable/Payable) must be **eliminated in full**.

#### **The Transit Item Trap (Goods/Cash in Transit):**
If Parent shows a receivable of ₹10,00,000 from Subsidiary, but Subsidiary shows a payable of only ₹8,00,000 because ₹2,00,000 cash/goods are in transit:
1. **First, record the transit item in the recipient's books:**
   \\[\text{Cash-in-Transit / Goods-in-Transit A/c }\quad \text{Dr. ₹2,00,000}\\]
   \\[\quad \text{To Trade Receivable / Subsidiary A/c }\quad \text{₹2,00,000}\\]
2. **Then eliminate the reciprocal balance of ₹8,00,000:**
   \\[\text{Trade Payable A/c }\quad \text{Dr. ₹8,00,000}\\]
   \\[\quad \text{To Trade Receivable A/c }\quad \text{₹8,00,000}\\]

---

### **4. UNREALIZED PROFIT ELIMINATION (INVENTORY & PPE)**

When group entities trade with each other, any profit booked on unsold goods/assets remaining within the group is **unrealized** and must be surgically removed.

```
                               ┌──────────────────────────────────┐
                               │   INTRA-GROUP UNREALIZED PROFIT  │
                               └────────────────┬─────────────────┘
                                                │
                       ┌────────────────────────┴────────────────────────┐
                       ▼                                                 ▼
        ┌─────────────────────────────┐                   ┌─────────────────────────────┐
        │       DOWNSTREAM SALE       │                   │        UPSTREAM SALE        │
        │    (Parent ➔ Subsidiary)    │                   │    (Subsidiary ➔ Parent)    │
        ├─────────────────────────────┤                   ├─────────────────────────────┤
        │ • Profit is in PARENT books.│                   │ • Profit is in SUBSIDIARY   │
        │ • Deduct 100% profit from   │                   │   books.                    │
        │   Consolidated P&L.         │                   │ • Deduct 100% profit from   │
        │ • NCI is NOT affected!      │                   │   Subsidiary's Post Profit. │
        │                             │                   │ • Reduced profit IS SHARED  │
        │                             │                   │   between Parent & NCI!     │
        └─────────────────────────────┘                   └─────────────────────────────┘
```

#### **A. Inventory Unrealized Profit**
* **Downstream Entry:**
  \\[\text{Consolidated P&L / Retained Earnings A/c }\quad \text{Dr.}\\]
  \\[\quad \text{To Inventory A/c (in Balance Sheet)}\\]
* **Upstream Entry:**
  \\[\text{Subsidiary Post-Acquisition P&L A/c }\quad \text{Dr.} \quad \left[\text{Allocated to Parent \& NCI in Share Ratio}\right]\\]
  \\[\quad \text{To Inventory A/c (in Balance Sheet)}\\]

---

#### **B. Depreciable PPE Unrealized Profit (The Double Whammy)**
When a depreciable asset is transferred within the group at a profit:
1. **Eliminate Initial Unrealized Profit:** Reduce asset carrying value in Balance Sheet to original cost to group.
2. **Reverse Excess Depreciation:** The buyer charges depreciation on the inflated transfer price. The excess depreciation charged must be **reversed (credited back to P&L)**!

##### **Journal Entries for Depreciable PPE Transfer:**

| Step | Downstream Sale (Parent \(\rightarrow\) Subsidiary) | Upstream Sale (Subsidiary \(\rightarrow\) Parent) |
| :--- | :--- | :--- |
| **1. Eliminate Profit on Sale** | **Consolidated Retained Earnings Dr.**<br>\(\quad\)**To PPE A/c** | **Subsidiary Post P&L Dr.** *(Hits NCI)*<br>\(\quad\)**To PPE A/c** |
| **2. Reverse Excess Depreciation** | **PPE (Accumulated Dep.) Dr.**<br>\(\quad\)**To Consolidated P&L** | **PPE (Accumulated Dep.) Dr.**<br>\(\quad\)**To Subsidiary Post P&L** *(Hits NCI)* |

---

### **WORKED NUMERICAL EXAMPLE (UPSTREAM PPE TRANSFER WITH DEPRECIATION)**

#### **Fact Pattern:**
* **Parent Ltd.** holds an 80% stake in **Sub Ltd.** (NCI = 20%).
* On **1st April 2024**, Sub Ltd. sells machinery to Parent Ltd. for **₹15,00,000**. The original cost in Sub Ltd.'s books was **₹10,00,000** (Profit booked by Sub = ₹5,00,000).
* Remaining useful life on 1st April 2024 is **5 years** (Straight-line method).
* Sub Ltd. reported a net profit of **₹12,00,000** for the year ended 31st March 2025.

#### **Required:**
Calculate the net profit allocated to NCI and show consolidation adjustments as of 31st March 2025.

---

#### **Professor’s Step-by-Step Solution:**

##### **1. Analysis of Transfers & Depreciation Adjustments:**
* **Unrealized Gain on Sale (1st April 2024):** \(₹15,00,000 - ₹10,00,000 = \mathbf{₹5,00,000}\).
* **Depreciation charged by Parent Ltd. in SFS:** \(\frac{₹15,00,000}{5 \text{ years}} = \mathbf{₹3,00,000}\).
* **Depreciation that should have been charged for Group:** \(\frac{₹10,00,000}{5 \text{ years}} = \mathbf{₹2,00,000}\).
* **Excess Depreciation to be reversed:** \(₹3,00,000 - ₹2,00,000 = \mathbf{₹1,00,000}\).

##### **2. Adjusted Post-Acquisition Profit of Sub Ltd. (Upstream Impact):**

| Particulars | Amount (₹) |
| :--- | :---: |
| Sub Ltd.'s Reported Net Profit for FY 2024–25 | 12,00,000 |
| **Less:** Unrealized Profit on Upstream Sale of PPE | (5,00,000) |
| **Add:** Reversal of Excess Depreciation on PPE | 1,00,000 |
| **Adjusted Post-Acquisition Profit of Sub Ltd.** | **8,00,000** |

##### **3. Profit Allocation to NCI (20%):**
\\[\text{NCI Share of Post Profit} = 20\% \times ₹8,00,000 = \mathbf{₹1,60,000}\\]

*(Note: If this were a Downstream sale, NCI would get 20% of reported ₹12,00,000 = ₹2,40,000, because Parent booked the profit!)*

---

### **EXAMINATION TRAPS & DEFERRED TAX IMPACT (Ind AS 12)**

> **ICAI EXAM BOMB:** Does eliminating intra-group unrealized profit generate Deferred Tax?
> **YES!** Under **Ind AS 12**, tax authorities assess each legal entity separately. The seller pays tax on the realized profit in its SFS, but the unrealized profit is eliminated in CFS. This creates a **Deductible Temporary Difference** (Tax base of asset in buyer's books > Carrying value in CFS).
> 
> \\[\text{Deferred Tax Asset (DTA) created in CFS} = \text{Unrealized Profit Eliminated} \times \text{Tax Rate}\\]

> 
> 1. *Calculate the unrealized profit to be eliminated in CFS.*
> 2. *Pass the exact consolidated journal entry for elimination of unrealized profit, including the Deferred Tax impact under Ind AS 12.*
> 3. *Calculate the net reduction in Non-Controlling Interest (NCI) share of profit.*</script>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" crossorigin="anonymous"></script>

  <!-- Core Self-Contained Application Script -->
  <script>
    (function () {
      var rawInput = document.getElementById('rawInput');
      var normalizedOutput = document.getElementById('normalizedOutput');
      var previewContainer = document.getElementById('previewContainer');
      var statusBadge = document.getElementById('statusBadge');
      var charCountLabel = document.getElementById('charCountLabel');
      var copyNotionBtn = document.getElementById('copyNotionBtn');
      var copyBtnText = document.getElementById('copyBtnText');
      var loadSampleBtn = document.getElementById('loadSampleBtn');
      var selfTestBtn = document.getElementById('selfTestBtn');
      var clearBtn = document.getElementById('clearBtn');
      var downloadMdBtn = document.getElementById('downloadMdBtn');
      var fileInput = document.getElementById('fileInput');
      var tabMarkdownBtn = document.getElementById('tabMarkdownBtn');
      var tabPreviewBtn = document.getElementById('tabPreviewBtn');
      var autoCopyToggle = document.getElementById('autoCopyToggle');

      var ruleDelimiters = document.getElementById('ruleDelimiters');
      var ruleEscapeAmp = document.getElementById('ruleEscapeAmp');
      var ruleTableMath = document.getElementById('ruleTableMath');
      var ruleTableBr = document.getElementById('ruleTableBr');
      var ruleMermaid = document.getElementById('ruleMermaid');

      var statEquations = document.getElementById('statEquations');
      var statAmpersands = document.getElementById('statAmpersands');
      var statTables = document.getElementById('statTables');

      function escapeAmpersandInTextMacros(latexStr, statsObj) {
        return latexStr.replace(/\\(text|textbf|textit|textrm|mathrm)\{([^{}]*)\}/g, function (match, macro, inner) {
          var out = '';
          for (var i = 0; i < inner.length; i++) {
            if (inner[i] === '&' && (i === 0 || inner[i - 1] !== '\\')) {
              statsObj.ampCount++;
              out += '\\&';
            } else {
              out += inner[i];
            }
          }
          return '\\' + macro + '{' + out + '}';
        });
      }

      function tryConvertAsciiToMermaid(codeText) {
        if (!/[┌┐└┘│─▼]/.test(codeText)) return null;

        if (codeText.indexOf('┴') !== -1 && codeText.indexOf('DOWNSTREAM') !== -1 && codeText.indexOf('UPSTREAM') !== -1) {
          return [
            'flowchart TD',
            '  A["INTRA-GROUP UNREALIZED PROFIT"] --> B["DOWNSTREAM SALE (Parent ➔ Subsidiary)\\n• Profit is in PARENT books.\\n• Deduct 100% profit from Consolidated P&L.\\n• NCI is NOT affected!"]',
            '  A --> C["UPSTREAM SALE (Subsidiary ➔ Parent)\\n• Profit is in SUBSIDIARY books.\\n• Deduct 100% profit from Subsidiary Post Profit.\\n• Reduced profit IS SHARED between Parent & NCI!"]'
          ].join('\n');
        }

        var lines = codeText.split('\n');
        var boxes = [];
        var currentBox = [];
        var inBox = false;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf('┌') !== -1 && line.indexOf('┐') !== -1) {
            inBox = true;
            currentBox = [];
          } else if (inBox && line.indexOf('└') !== -1 && line.indexOf('┘') !== -1) {
            inBox = false;
            if (currentBox.length > 0) {
              boxes.push(currentBox.join('\\n'));
            }
          } else if (inBox && line.indexOf('│') !== -1) {
            var rawParts = line.split('│');
            var parts = [];
            for (var j = 0; j < rawParts.length; j++) {
              var trimmed = rawParts[j].trim();
              if (trimmed) parts.push(trimmed);
            }
            if (parts.length === 1) {
              currentBox.push(parts[0].replace(/"/g, "'"));
            } else if (parts.length > 1) {
              return null;
            }
          }
        }

        if (boxes.length >= 2) {
          var mermaidLines = ['flowchart TD'];
          for (var k = 0; k < boxes.length; k++) {
            var nodeId = 'N' + (k + 1);
            mermaidLines.push('  ' + nodeId + '["' + boxes[k] + '"]');
            if (k > 0) {
              mermaidLines.push('  N' + k + ' --> ' + nodeId);
            }
          }
          return mermaidLines.join('\n');
        }
        return null;
      }

      function transformMarkdown(raw) {
        var text = String(raw || '').replace(/\r\n/g, '\n');
        var stats = { eqCount: 0, ampCount: 0, tableCells: 0 };

        var codeBlocks = [];
        text = text.replace(/```([^\n]*)\n([\s\S]*?)```/g, function (match, lang, body) {
          var cleanLang = (lang || '').trim();
          var finalLang = cleanLang || 'text';
          var finalBody = body;

          if (ruleMermaid.checked && (!cleanLang || cleanLang === 'text' || cleanLang === 'plaintext')) {
            var mermaidCode = tryConvertAsciiToMermaid(body);
            if (mermaidCode) {
              finalLang = 'mermaid';
              finalBody = mermaidCode + '\n';
            }
          }

          var placeholder = '@@CODE_BLOCK_' + codeBlocks.length + '@@';
          codeBlocks.push({ lang: finalLang, body: finalBody });
          return placeholder;
        });

        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var trimmed = line.trim();
          if (trimmed.charAt(0) === '|' && trimmed.charAt(trimmed.length - 1) === '|') {
            var updated = line;

            if (ruleTableMath.checked) {
              updated = updated.replace(/\\\\?\(\s*\\(?:rightarrow|to)\s*\\\\?\)/g, function () {
                stats.tableCells++;
                return '→';
              });
              updated = updated.replace(/\\\\?\(\s*\\leftarrow\s*\\\\?\)/g, function () {
                stats.tableCells++;
                return '←';
              });
              updated = updated.replace(/\\\\?\(\s*\\q?quad\s*\\\\?\)/g, function () {
                stats.tableCells++;
                return ' ';
              });
            }

            if (ruleTableBr.checked) {
              updated = updated.replace(/<br\s*\/?>/gi, function () {
                stats.tableCells++;
                return '\u2028';
              });
            }

            lines[i] = updated;
          } else if (ruleTableBr.checked && /<br\s*\/?>/i.test(line)) {
            lines[i] = line.replace(/<br\s*\/?>/gi, '\n');
          }
        }
        text = lines.join('\n');

        if (ruleDelimiters.checked) {
          text = text.replace(/(^|\n)([ \t]*>[ \t]*)?[ \t]*\\\\?\[([\s\S]*?)\\\\?\][ \t]*(?=\n|$)/g, function (match, lead, quotePrefix, inner) {
            stats.eqCount++;
            var cleanInner = inner.trim();
            if (ruleEscapeAmp.checked) {
              cleanInner = escapeAmpersandInTextMacros(cleanInner, stats);
            }
            if (quotePrefix) {
              return lead + quotePrefix + '$$' + cleanInner + '$$';
            }
            return lead + '$$\n' + cleanInner + '\n$$';
          });

          text = text.replace(/\\\\?\[([\s\S]*?)\\\\?\]/g, function (match, inner) {
            stats.eqCount++;
            var cleanInner = inner.trim();
            if (ruleEscapeAmp.checked) {
              cleanInner = escapeAmpersandInTextMacros(cleanInner, stats);
            }
            return '$$' + cleanInner + '$$';
          });

          text = text.replace(/\\\\?\(([\s\S]*?)\\\\?\)/g, function (match, inner) {
            stats.eqCount++;
            var cleanInner = inner.trim();
            if (ruleEscapeAmp.checked) {
              cleanInner = escapeAmpersandInTextMacros(cleanInner, stats);
            }
            return '$' + cleanInner + '$';
          });
        }

        if (ruleEscapeAmp.checked) {
          text = text.replace(/\$\$([\s\S]*?)\$\$/g, function (m, inner) {
            return '$$' + escapeAmpersandInTextMacros(inner, stats) + '$$';
          });
          text = text.replace(/\$([^\n$]+?)\$/g, function (m, inner) {
            return '$' + escapeAmpersandInTextMacros(inner, stats) + '$';
          });
        }

        text = text.replace(/@@CODE_BLOCK_(\d+)@@/g, function (m, idx) {
          var blk = codeBlocks[Number(idx)];
          return '```' + blk.lang + '\n' + blk.body + '```';
        });

        return { normalized: text, stats: stats };
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderMathSnippet(tex, displayMode) {
        if (window.katex && typeof window.katex.renderToString === 'function') {
          try {
            var html = window.katex.renderToString(tex, {
              displayMode: displayMode,
              throwOnError: false,
              strict: false
            });
            return displayMode
              ? '<div class="notion-math-block">' + html + '</div>'
              : html;
          } catch (e) {}
        }
        return displayMode
          ? '<div class="notion-math-block">$$ ' + escapeHtml(tex) + ' $$</div>'
          : '<span class="notion-math-inline">$' + escapeHtml(tex) + '$</span>';
      }

      function formatInlineMarkdown(line) {
        var mathSlots = [];
        var s = line.replace(/\$\$(.+?)\$\$/g, function (m, tex) {
          var id = '@@INLINE_MATH_' + mathSlots.length + '@@';
          mathSlots.push(renderMathSnippet(tex.trim(), false));
          return id;
        });
        s = s.replace(/\$([^\n$]+?)\$/g, function (m, tex) {
          var id = '@@INLINE_MATH_' + mathSlots.length + '@@';
          mathSlots.push(renderMathSnippet(tex.trim(), false));
          return id;
        });

        s = escapeHtml(s);
        s = s.replace(/\u2028/g, '<br>');
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');

        s = s.replace(/@@INLINE_MATH_(\d+)@@/g, function (m, idx) {
          return mathSlots[Number(idx)] || m;
        });
        return s;
      }

      function renderPreviewHtml(md) {
        var blocks = [];
        var working = md.replace(/```([^\n]*)\n([\s\S]*?)```/g, function (m, lang, body) {
          var id = '@@PREVIEW_BLOCK_' + blocks.length + '@@';
          blocks.push('<pre><code>' + escapeHtml(body) + '</code></pre>');
          return id;
        });

        working = working.replace(/\$\$\n([\s\S]*?)\n\$\$/g, function (m, tex) {
          var id = '@@PREVIEW_BLOCK_' + blocks.length + '@@';
          blocks.push(renderMathSnippet(tex.trim(), true));
          return id;
        });

        var lines = working.split('\n');
        var out = [];
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];
          var trimmed = line.trim();

          if (!trimmed) {
            i++;
            continue;
          }

          if (/^@@PREVIEW_BLOCK_\d+@@$/.test(trimmed)) {
            var idx = Number(trimmed.replace(/\D+/g, ''));
            out.push(blocks[idx]);
            i++;
            continue;
          }

          if (/^---+$/.test(trimmed)) {
            out.push('<hr>');
            i++;
            continue;
          }

          var hMatch = line.match(/^(#{1,5})\s+(.*)$/);
          if (hMatch) {
            var level = hMatch[1].length;
            out.push('<h' + level + '>' + formatInlineMarkdown(hMatch[2]) + '</h' + level + '>');
            i++;
            continue;
          }

          if (trimmed.charAt(0) === '|' && trimmed.charAt(trimmed.length - 1) === '|') {
            var tableLines = [];
            while (i < lines.length && lines[i].trim().charAt(0) === '|') {
              tableLines.push(lines[i].trim());
              i++;
            }
            if (tableLines.length >= 2) {
              var htmlTable = '<table>';
              var headerCells = tableLines[0].slice(1, -1).split('|');
              htmlTable += '<thead><tr>';
              for (var c = 0; c < headerCells.length; c++) {
                htmlTable += '<th>' + formatInlineMarkdown(headerCells[c].trim()) + '</th>';
              }
              htmlTable += '</tr></thead><tbody>';
              for (var r = 2; r < tableLines.length; r++) {
                var rowCells = tableLines[r].slice(1, -1).split('|');
                htmlTable += '<tr>';
                for (var rc = 0; rc < rowCells.length; rc++) {
                  htmlTable += '<td>' + formatInlineMarkdown(rowCells[rc].trim()) + '</td>';
                }
                htmlTable += '</tr>';
              }
              htmlTable += '</tbody></table>';
              out.push(htmlTable);
              continue;
            }
          }

          if (trimmed.charAt(0) === '>') {
            var quoteLines = [];
            while (i < lines.length && lines[i].trim().charAt(0) === '>') {
              quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            out.push('<blockquote>' + quoteLines.map(formatInlineMarkdown).join('<br>') + '</blockquote>');
            continue;
          }

          if (/^\s*([*-]|\d+\.)\s+/.test(line)) {
            var isOrdered = /^\s*\d+\.\s+/.test(line);
            var tag = isOrdered ? 'ol' : 'ul';
            var listItems = [];
            while (i < lines.length && /^\s*([*-]|\d+\.)\s+/.test(lines[i])) {
              var itemText = lines[i].replace(/^\s*([*-]|\d+\.)\s+/, '');
              listItems.push('<li>' + formatInlineMarkdown(itemText) + '</li>');
              i++;
            }
            out.push('<' + tag + '>' + listItems.join('') + '</' + tag + '>');
            continue;
          }

          out.push('<p>' + formatInlineMarkdown(line) + '</p>');
          i++;
        }

        return out.join('\n');
      }

      function updateAll(triggerSource) {
        var raw = rawInput.value;
        var result = transformMarkdown(raw);
        normalizedOutput.value = result.normalized;

        statEquations.textContent = result.stats.eqCount + ' equation' + (result.stats.eqCount === 1 ? '' : 's') + ' fixed';
        statAmpersands.textContent = result.stats.ampCount + ' \\text{&} fixed';
        statTables.textContent = result.stats.tableCells + ' table item' + (result.stats.tableCells === 1 ? '' : 's') + ' cleaned';
        charCountLabel.textContent = result.normalized.length.toLocaleString() + ' chars';

        previewContainer.innerHTML = renderPreviewHtml(result.normalized);

        var now = new Date();
        var timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        statusBadge.textContent = (triggerSource ? triggerSource + ' • ' : 'Converted • ') + timeStr;
      }

      function copyForNotion(customMsg) {
        var textToCopy = normalizedOutput.value;
        if (!textToCopy) {
          showToast('Nothing to copy yet—paste some Markdown on the left first!');
          return;
        }

        function onCopied() {
          showToast(customMsg || 'Copied! Switch to Notion and press Ctrl+V.');
          copyBtnText.textContent = '✓ Copied! Ready for Ctrl+V';
          setTimeout(function () {
            copyBtnText.textContent = 'Copy for Notion (Ctrl+Shift+C)';
          }, 2200);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(onCopied).catch(function () {
            fallbackCopy(textToCopy, onCopied);
          });
        } else {
          fallbackCopy(textToCopy, onCopied);
        }
      }

      function fallbackCopy(text, callback) {
        var temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        try {
          document.execCommand('copy');
        } catch (e) {}
        document.body.removeChild(temp);
        if (callback) callback();
      }

      var toastTimer = null;
      function showToast(msg) {
        var toast = document.getElementById('toast');
        var toastMsg = document.getElementById('toastMsg');
        toastMsg.textContent = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2800);
      }

      rawInput.addEventListener('input', function () {
        updateAll('Converted');
      });

      rawInput.addEventListener('paste', function () {
        setTimeout(function () {
          updateAll('Pasted & Converted');
          if (autoCopyToggle.checked && rawInput.value.trim().length > 0) {
            copyForNotion('Normalized & auto-copied! Just press Ctrl+V in Notion.');
          }
        }, 20);
      });

      var rules = [ruleDelimiters, ruleEscapeAmp, ruleTableMath, ruleTableBr, ruleMermaid];
      for (var r = 0; r < rules.length; r++) {
        rules[r].addEventListener('change', function () {
          updateAll('Rules Updated');
        });
      }

      copyNotionBtn.addEventListener('click', function () {
        copyForNotion();
      });

      loadSampleBtn.addEventListener('click', function () {
        var sampleEl = document.getElementById('sample-data');
        rawInput.value = sampleEl ? sampleEl.textContent : '';
        updateAll('Sample Loaded');
        showToast('Loaded Ind AS 110 sample note.');
      });

      selfTestBtn.addEventListener('click', function () {
        var sampleEl = document.getElementById('sample-data');
        var sampleText = sampleEl ? sampleEl.textContent : '';
        var res = transformMarkdown(sampleText);
        var checks = [
          res.stats.eqCount >= 12,
          res.stats.ampCount >= 1,
          res.stats.tableCells >= 10,
          res.normalized.indexOf('\\text{Consolidated P\\&L') !== -1,
          res.normalized.indexOf('\\[') === -1
        ];
        var allPassed = checks.every(Boolean);
        rawInput.value = sampleText;
        updateAll('Self-Test Passed ✓');
        showToast(
          allPassed
            ? 'Self-Test PASSED: ' + res.stats.eqCount + ' equations, ' + res.stats.ampCount + ' & escaped, ' + res.stats.tableCells + ' table items fixed!'
            : 'Self-Test completed with warnings.'
        );
      });

      clearBtn.addEventListener('click', function () {
        rawInput.value = '';
        updateAll('Cleared');
        rawInput.focus();
      });

      downloadMdBtn.addEventListener('click', function () {
        var blob = new Blob([normalizedOutput.value], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'notion-ready-notes.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded notion-ready-notes.md');
      });

      fileInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          rawInput.value = String(ev.target.result || '');
          updateAll('File Loaded');
          showToast('Loaded ' + file.name);
        };
        reader.readAsText(file);
      });

      window.addEventListener('dragover', function (e) {
        e.preventDefault();
      });
      window.addEventListener('drop', function (e) {
        e.preventDefault();
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          rawInput.value = String(ev.target.result || '');
          updateAll('File Dropped');
          showToast('Loaded ' + file.name);
        };
        reader.readAsText(file);
      });

      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          copyForNotion();
        }
      });

      tabMarkdownBtn.addEventListener('click', function () {
        normalizedOutput.classList.remove('hidden');
        previewContainer.classList.add('hidden');
        tabMarkdownBtn.classList.add('active');
        tabPreviewBtn.classList.remove('active');
      });

      tabPreviewBtn.addEventListener('click', function () {
        previewContainer.classList.remove('hidden');
        normalizedOutput.classList.add('hidden');
        tabPreviewBtn.classList.add('active');
        tabMarkdownBtn.classList.remove('active');
      });

      var initialSample = document.getElementById('sample-data');
      if (initialSample) {
        rawInput.value = initialSample.textContent;
        updateAll('Ready');
      }
    })();
  </script>
